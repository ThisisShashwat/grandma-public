{% import "macros/art.html" as art %}
<header class="wrap strip">
  <a class="brand" href="{{ url('home') }}#top">
    <span class="fig chip ph" data-file="logo-mark.png">{{ art.img("logo-mark.png", "", (56, 56), lazy=false) }}</span>
    {{ site.name }}
  </a>
  <nav aria-label="Main">
    <a href="{{ url('guides') }}">Guides</a>
    <a href="{{ url('shop') }}">Pantry</a>
    <a href="{{ url('ribbons') }}">Ribbons</a>
    <a href="{{ url('leaderboard') }}">Leaderboard</a>
    <a href="{{ url('home') }}#faq">FAQ</a>
    <a data-link="slack" {{ link_attrs("slack") }}>Slack</a>
    {% if request is defined and request.user.is_authenticated %}
    <a href="{{ url('dashboard') }}">Dashboard</a>
    <form class="nav-leave" method="post" action="{{ url('logout') }}">{{ csrf_input }}<button>Log out</button></form>
    {% else %}
    <a href="{{ url('login') }}">Sign in</a>
    {% endif %}
    <a class="btn" data-link="signup" data-confetti {{ link_attrs("signup") }}>Sign up</a>
  </nav>
</header>
